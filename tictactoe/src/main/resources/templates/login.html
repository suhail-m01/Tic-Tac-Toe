<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TicTacToe — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c12;--panel:#0f1520;--surface:#16202e;--border:#1e2d40;
  --text:#f0f4f8;--text2:#8899aa;--muted:#4a5a6a;
  --x:#ff4757;--o:#00d2d3;--gold:#ffd32a;
  --accent:#00d2d3;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}

/* LEFT PANEL - decorative */
.left{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;position:relative;overflow:hidden}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.5}
.board-demo{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:240px;margin-bottom:40px}
.board-demo::before,.board-demo::after{content:'';position:absolute;background:var(--border);z-index:0}
.demo-cell{width:78px;height:78px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:40px;border:1px solid var(--border);background:rgba(22,32,46,.8);position:relative;animation:cellAppear .6s ease both}
.demo-cell:nth-child(1){animation-delay:.1s}.demo-cell:nth-child(2){animation-delay:.2s}.demo-cell:nth-child(3){animation-delay:.3s}
.demo-cell:nth-child(4){animation-delay:.4s}.demo-cell:nth-child(5){animation-delay:.5s}.demo-cell:nth-child(6){animation-delay:.6s}
.demo-cell:nth-child(7){animation-delay:.7s}.demo-cell:nth-child(8){animation-delay:.8s}.demo-cell:nth-child(9){animation-delay:.9s}
@keyframes cellAppear{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.demo-x{color:var(--x);text-shadow:0 0 20px rgba(255,71,87,.5)}
.demo-o{color:var(--o);text-shadow:0 0 20px rgba(0,210,211,.5)}
.demo-cell.win-cell{background:rgba(255,211,42,.06);border-color:var(--gold)}
.tagline{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:.05em;text-align:center;position:relative;z-index:1;line-height:1.1}
.tagline span{color:var(--accent)}
.sub{font-size:13px;color:var(--text2);margin-top:10px;text-align:center;position:relative;z-index:1}

/* RIGHT PANEL - login form */
.right{display:flex;align-items:center;justify-content:center;padding:60px 80px}
.form-wrap{width:100%;max-width:360px;animation:slideIn .5s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:48px}
.brand-icon{width:42px;height:42px;background:linear-gradient(135deg,var(--x),var(--o));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.1em}
h1{font-size:28px;font-weight:600;margin-bottom:6px}
.lead{font-size:14px;color:var(--text2);margin-bottom:32px}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:20px}
.alert-error{background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3);color:#ff6b7a}
.alert-success{background:rgba(0,210,211,.1);border:1px solid rgba(0,210,211,.3);color:var(--o)}
.fg{margin-bottom:18px}
label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}
input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,210,211,.1)}
input::placeholder{color:var(--muted)}
.btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,var(--x),#c0392b);border:none;border-radius:10px;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:.02em}
.btn-primary:hover{opacity:.9}.btn-primary:active{transform:scale(.99)}
.divider{text-align:center;color:var(--muted);font-size:12px;margin:20px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:44%;height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}
.btn-ghost{width:100%;padding:12px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:all .2s}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
a{color:var(--accent);text-decoration:none}
@media(max-width:768px){body{grid-template-columns:1fr}.left{display:none}.right{padding:40px 30px}}
</style>
</head>
<body>
<div class="left">
  <div class="grid-bg"></div>
  <div class="board-demo">
    <div class="demo-cell demo-x win-cell">X</div>
    <div class="demo-cell demo-o">O</div>
    <div class="demo-cell demo-x win-cell">X</div>
    <div class="demo-cell demo-o">O</div>
    <div class="demo-cell demo-x win-cell">X</div>
    <div class="demo-cell demo-o">O</div>
    <div class="demo-cell demo-x win-cell">X</div>
    <div class="demo-cell"></div>
    <div class="demo-cell demo-o">O</div>
  </div>
  <div class="tagline">Play.<br>Win.<br><span>Repeat.</span></div>
  <div class="sub">Challenge the AI or battle a friend</div>
</div>

<div class="right">
  <div class="form-wrap">
    <div class="brand">
      <div class="brand-icon">✕</div>
      <div class="brand-name">TicTacToe</div>
    </div>
    <h1>Welcome back</h1>
    <div class="lead">Sign in to continue playing</div>

    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${logout}"  class="alert alert-success" th:text="${logout}"></div>

    <form th:action="@{/login}" method="post">
      <div class="fg">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required autocomplete="username">
      </div>
      <div class="fg">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Sign In →</button>
    </form>

    <div class="divider">or</div>
    <button class="btn-ghost" onclick="location.href='/register'">Create an Account</button>
  </div>
</div>
</body>
</html>
