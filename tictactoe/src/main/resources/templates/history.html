<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TicTacToe — History</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c12;--surface:#0f1520;--card:#13192a;--border:#1e2d40;--text:#f0f4f8;--text2:#8899aa;--muted:#4a5a6a;--x:#ff4757;--o:#00d2d3;--gold:#ffd32a;--green:#2ecc71}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px}
.nav-brand{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.08em}
.spacer{flex:1}
.nav-btn{background:none;border:1px solid var(--border);border-radius:7px;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 12px;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center}
.nav-btn:hover{border-color:var(--o);color:var(--o)}
.page{max-width:900px;margin:0 auto;padding:32px 24px}
h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:.05em;margin-bottom:4px}
.sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.sum-num{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;margin-bottom:4px}
.sum-lbl{font-size:11px;color:var(--muted)}
.sum-num.w{color:var(--green)}.sum-num.l{color:var(--x)}.sum-num.d{color:var(--gold)}.sum-num.t{color:var(--o)}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:12px 16px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid rgba(30,45,64,.5);color:var(--text2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(22,32,46,.5)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:'DM Mono',monospace}
.badge.win{background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.3);color:var(--green)}
.badge.loss{background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3);color:var(--x)}
.badge.draw{background:rgba(255,211,42,.1);border:1px solid rgba(255,211,42,.3);color:var(--gold)}
.mini-board{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:48px;height:48px}
.mb{background:rgba(22,32,46,.8);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:12px}
.mb.x{color:var(--x)}.mb.o{color:var(--o)}
.empty-state{text-align:center;padding:60px;color:var(--muted);font-size:14px}
.empty-state div{font-size:40px;margin-bottom:12px}
</style>
</head>
<body>
<nav>
  <div class="nav-brand">TICTACTOE</div>
  <div class="spacer"></div>
  <a href="/game" class="nav-btn">← Back to Game</a>
  <form th:action="@{/logout}" method="post" style="display:inline">
    <button type="submit" class="nav-btn" style="color:var(--x)">Sign Out</button>
  </form>
</nav>

<div class="page">
  <h1>Game History</h1>
  <div class="sub" th:text="'All games played by ' + ${user.username}">History</div>

  <div class="summary">
    <div class="sum-card"><div class="sum-num t" th:text="${user.totalGames}">0</div><div class="sum-lbl">Total Games</div></div>
    <div class="sum-card"><div class="sum-num w" th:text="${user.wins}">0</div><div class="sum-lbl">Wins</div></div>
    <div class="sum-card"><div class="sum-num l" th:text="${user.losses}">0</div><div class="sum-lbl">Losses</div></div>
    <div class="sum-card"><div class="sum-num d" th:text="${user.draws}">0</div><div class="sum-lbl">Draws</div></div>
  </div>

  <div class="table-wrap" th:if="${not #lists.isEmpty(records)}">
    <table>
      <thead>
        <tr>
          <th>Board</th>
          <th>Result</th>
          <th>Opponent</th>
          <th>Mode</th>
          <th>Moves</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="r : ${records}">
          <td>
            <div class="mini-board">
              <th:block th:each="c : ${#strings.listSplit(r.boardSnapshot, '')}">
                <div th:class="${c == 'X'} ? 'mb x' : (${c == 'O'} ? 'mb o' : 'mb')"
                     th:text="${c == '_'} ? '' : ${c}"></div>
              </th:block>
            </div>
          </td>
          <td>
            <span th:class="${r.result == 'WIN'} ? 'badge win' : (${r.result == 'LOSS'} ? 'badge loss' : 'badge draw')"
                  th:text="${r.result == 'WIN'} ? '✓ Win' : (${r.result == 'LOSS'} ? '✗ Loss' : '= Draw')"></span>
          </td>
          <td th:text="${r.opponentName}">—</td>
          <td th:text="${r.mode == 'VS_AI'} ? '🤖 vs AI' : '👥 vs Friend'">—</td>
          <td th:text="${r.moves}">0</td>
          <td th:text="${#temporals.format(r.playedAt, 'dd MMM, HH:mm')}">—</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" th:if="${#lists.isEmpty(records)}">
    <div>🎮</div>
    <div>No games played yet.</div>
    <div style="margin-top:8px;font-size:12px"><a href="/game" style="color:var(--o)">Play your first game →</a></div>
  </div>
</div>
</body>
</html>
